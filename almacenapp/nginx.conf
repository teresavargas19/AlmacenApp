server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real (ej. /productos, /roles)
    # cae en index.html para que React Router la maneje del lado del cliente.
    location / {
        try_files $uri /index.html;
    }
}
